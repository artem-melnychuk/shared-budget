# Allowlist proxy for the shared_budget sandbox agent.
#
# No TLS interception: Squid reads only the hostname from the CONNECT
# request line, never decrypts traffic. Sites keep their own certificates
# and the agent's TLS verification is untouched.
#
# A domain here (leading dot) matches it and all its subdomains.
# See which domains the agent tried to reach:
#   docker compose -f .sandbox/compose.yaml exec proxy tail -50 /var/log/squid/access.log

# Claude Code itself: API, claude.ai sign-in, token exchange, updates.
acl allowed_dst dstdomain .anthropic.com
acl allowed_dst dstdomain .claude.com
acl allowed_dst dstdomain .claude.ai

# Python packages.
acl allowed_dst dstdomain pypi.org
acl allowed_dst dstdomain files.pythonhosted.org

# The services the app itself talks to. Only reachable for an explicit live
# check; the agent's rules keep tests offline.
acl allowed_dst dstdomain api.telegram.org
acl allowed_dst dstdomain generativelanguage.googleapis.com

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow CONNECT SSL_ports allowed_dst
http_access deny CONNECT
http_access allow allowed_dst
http_access deny all

http_port 3128

# Small cache footprint; this proxy is a gate, not a speed-up.
cache_mem 8 MB
maximum_object_size 0 KB
access_log stdio:/var/log/squid/access.log
